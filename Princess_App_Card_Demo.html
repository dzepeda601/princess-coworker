<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-mKBf+nI9Hmxa4cI3gDdAyY4akDZCHClXNL1rHcSJQpY='; style-src 'unsafe-inline'; img-src https: data:; connect-src 'self' https://main--princess-coworker--dzepeda601.aem.page https://main--princess-coworker--dzepeda601.aem.live; base-uri 'none'; form-action 'none'">
<title>Princess App Card Demo</title>
<style>
  :root{--blue:#0B3799;--mag:#E4005B;--teal:#2BA7C4;--navy:#0A1F44;--mist:#F1EFEE;--ink:#1A1A1A;--grey:#6B7280}
  *{box-sizing:border-box}
  body{margin:0;background:var(--mist);font-family:Arial,Helvetica,sans-serif;color:var(--ink);padding:32px 16px}
  .wrap{max-width:980px;margin:0 auto;display:flex;gap:32px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .phone{width:390px;max-width:100%;background:#fff;border:10px solid #111;border-radius:44px;overflow:hidden;box-shadow:0 20px 50px rgba(10,31,68,.25)}
  .status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:bold;background:#fff}
  .appbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 0;height:48px;background:#fff;border-bottom:1px solid #e5e2de}
  .logo{background:var(--blue);color:#fff;height:48px;padding:0 18px 0 16px;border-bottom-right-radius:18px;display:flex;align-items:center;font-family:Georgia,'Times New Roman',serif;font-weight:bold;letter-spacing:2px;font-size:15px}
  .menu{width:22px;height:2px;background:var(--blue);box-shadow:0 6px 0 var(--blue),0 -6px 0 var(--blue)}
  .screen{background:var(--mist);padding:16px;min-height:560px}
  .h{font-size:11px;font-weight:bold;letter-spacing:1.5px;color:var(--grey);margin:4px 0 10px}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .hero{height:210px;background:linear-gradient(135deg,var(--navy),var(--blue) 55%,var(--teal));position:relative}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:20px 20px 18px;text-align:center}
  .brand{font-size:11px;font-weight:bold;letter-spacing:1.5px;color:var(--blue)}
  .eyebrow{font-size:11px;font-weight:bold;letter-spacing:2px;color:var(--mag);margin-top:10px}
  .title{font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:32px;font-weight:bold;margin:10px 0 0}
  .sub{font-size:14px;line-height:21px;color:#4d4d4d;margin:10px 0 0}
  .cta{display:inline-block;margin-top:18px;background:var(--mag);color:#fff;text-decoration:none;font-weight:bold;letter-spacing:1px;font-size:13px;padding:14px 28px;border-radius:24px}
  .disc{font-size:10px;line-height:15px;color:var(--grey);margin:14px 0 0}
  .panel{flex:1 1 320px;max-width:460px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .panel h2{font-family:Georgia,'Times New Roman',serif;color:var(--blue);margin:0 0 6px;font-size:22px}
  .panel p{font-size:13px;color:#4d4d4d;line-height:19px;margin:0 0 12px}
  .pill{display:inline-block;font-size:11px;font-weight:bold;letter-spacing:1px;padding:5px 12px;border-radius:14px;color:#fff;background:var(--grey)}
  .pill.live{background:#1E8E5A}.pill.fb{background:#B7791F}
  code.src{display:block;font-size:11px;word-break:break-all;background:#f6f5f4;padding:8px;border-radius:6px;margin:10px 0}
  pre{font-size:11px;line-height:16px;background:#0A1F44;color:#d7e6ff;padding:12px;border-radius:8px;overflow:auto;max-height:300px;margin:12px 0 0}
  button{font:inherit;font-size:12px;font-weight:bold;letter-spacing:1px;color:var(--ink);background:#fff;border:2px solid var(--mag);border-radius:20px;padding:8px 18px;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" aria-label="Princess app mockup">
    <div class="status"><span>9:41</span><span>5G &#9679;&#9679;&#9679;</span></div>
    <div class="appbar"><div class="logo">PRINCESS</div><div class="menu" aria-hidden="true"></div></div>
    <div class="screen">
      <div class="h">FEATURED FOR YOU</div>
      <div class="card">
        <div class="hero"><img id="img" alt="" hidden></div>
        <div class="body">
          <div class="brand">PRINCESS CRUISES</div>
          <div class="eyebrow" id="eyebrow"></div>
          <h1 class="title" id="title"></h1>
          <p class="sub" id="subtitle"></p>
          <a class="cta" id="cta" rel="noopener noreferrer"></a>
          <p class="disc" id="disclaimer"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Headless delivery demo</h2>
    <p>This app card reads one row from a DA sheet published as JSON. Edit the sheet, publish, and refresh to see the card change with no code change.</p>
    <span class="pill" id="status">LOADING</span><button id="refresh" type="button">REFRESH</button>
    <code class="src" id="source"></code>
    <pre id="json" aria-label="Raw JSON response"></pre>
  </div>
</div>

<script>
(function () {
  'use strict';
  var ORIGIN = 'https://main--princess-coworker--dzepeda601.aem.page';
  var PATH = '/cruise-destinations/app-banners.json';
  // Same-origin first (works when served by the AEM dev server or from the site itself).
  var SOURCES = [
    PATH,
    ORIGIN + PATH,
    'https://main--princess-coworker--dzepeda601.aem.live' + PATH
  ];
  var DEFAULT_ID = 'alaska-early-booking';

  // Used when the live sheet cannot be reached, so the demo never breaks.
  var FALLBACK = { total: 1, offset: 0, limit: 1, data: [{
    id: 'alaska-early-booking',
    eyebrow: 'EARLY BOOKING BONUS',
    title: 'The Great Land is calling.',
    subtitle: 'Glaciers, parks and wildlife. Up to $300 instant savings* + up to $300 onboard credit.',
    ctaLabel: 'VIEW CRUISES',
    ctaUrl: 'https://www.princess.com/cruise-destinations/alaska-cruises',
    image: '',
    imageAlt: 'Alaska glacier seen from a Princess ship',
    disclaimer: '*Prices include taxes and fees. Prices are per person, double occupancy, in USD. Offer terms apply.'
  }] };

  function $(id) { return document.getElementById(id); }

  // Only https URLs are allowed; relative paths resolve against the EDS site.
  function safeUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return null;
    try {
      var u = new URL(value.trim(), ORIGIN);
      return u.protocol === 'https:' ? u.href : null;
    } catch (e) { return null; }
  }

  function pickId() {
    var q = new URLSearchParams(window.location.search).get('id');
    return q && /^[a-z0-9-]{1,64}$/.test(q) ? q : DEFAULT_ID;
  }

  function render(row) {
    $('eyebrow').textContent = row.eyebrow || '';
    $('title').textContent = row.title || '';
    $('subtitle').textContent = row.subtitle || '';
    $('disclaimer').textContent = row.disclaimer || '';
    var cta = $('cta');
    cta.textContent = row.ctaLabel || 'VIEW CRUISES';
    var href = safeUrl(row.ctaUrl);
    if (href) { cta.setAttribute('href', href); } else { cta.removeAttribute('href'); }
    var img = $('img');
    var src = safeUrl(row.image);
    if (src) {
      img.onerror = function () { img.hidden = true; };
      img.alt = row.imageAlt || '';
      img.src = src;
      img.hidden = false;
    } else {
      img.hidden = true;
    }
  }

  function setStatus(kind, text) {
    var s = $('status');
    s.className = 'pill ' + kind;
    s.textContent = text;
  }

  function show(payload) {
    $('json').textContent = JSON.stringify(payload, null, 2);
  }

  function rowsOf(payload) {
    if (!payload) return [];
    if (Array.isArray(payload.data)) return payload.data;
    var names = Array.isArray(payload[':names']) ? payload[':names'] : [];
    for (var i = 0; i < names.length; i++) {
      var sheet = payload[names[i]];
      if (sheet && Array.isArray(sheet.data)) return sheet.data;
    }
    return [];
  }

  function choose(payload) {
    var rows = rowsOf(payload);
    var id = pickId();
    return rows.find(function (r) { return r && r.id === id; }) || rows[0] || null;
  }

  function tryFetch(url) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 6000);
    return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctrl.signal })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (payload) { clearTimeout(timer); return payload; },
            function (err) { clearTimeout(timer); throw err; });
  }

  function load() {
    setStatus('', 'LOADING');
    var errors = [];
    var i = 0;
    function next() {
      if (i >= SOURCES.length) return Promise.reject(new Error('all sources failed'));
      var url = SOURCES[i++];
      $('source').textContent = url;
      return tryFetch(url).then(function (payload) {
        var row = choose(payload);
        if (!row) throw new Error('No rows in JSON');
        return { payload: payload, row: row };
      }).catch(function (err) {
        errors.push((url.indexOf('.aem.live') > -1 ? 'live' : url.indexOf('.aem.page') > -1 ? 'page' : 'local') + ': ' + err.message);
        return next();
      });
    }
    next().then(function (r) {
      render(r.row); show(r.payload);
      setStatus('live', 'LIVE FROM DA SHEET');
    }).catch(function () {
      render(choose(FALLBACK)); show(FALLBACK);
      setStatus('fb', 'FALLBACK DATA');
      $('source').textContent = 'Not reached. ' + errors.join(' | ');
    });
  }

  $('refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
